name: Build and Release Clothify Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./clothify

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Compile Native Windows Executable (clothify.exe)
        run: |
          & C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /out:clothify.exe /win32icon:src\main\resources\Images\clothify.ico ClothifyLauncher.cs

      - name: Build Embedded JRE with jlink
        run: |
          $jlink = "$env:JAVA_HOME\bin\jlink.exe"
          $jmods = "$env:JAVA_HOME\jmods"
          $modules = "java.base,java.desktop,java.sql,java.naming,java.management,java.xml,java.logging,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,java.security.sasl,java.security.jgss"
          & $jlink --module-path $jmods --add-modules $modules --strip-debug --no-man-pages --no-header-files --compress=2 --output dist\jre

      - name: Prepare Release Bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist\config
          Copy-Item target\clothify-*-jar-with-dependencies.jar dist\clothify-app.jar
          Copy-Item clothify.exe dist\clothify.exe
          Copy-Item config\database.properties.example dist\config\database.properties
          Copy-Item run.bat dist\run.bat
          if (Test-Path clothify.vbs) { Copy-Item clothify.vbs dist\clothify.vbs }
          
          @"
          ==================================================
              Clothify Store - Haute Couture POS & ERP
          ==================================================

          HOW TO RUN:
          1. Double-click 'clothify.exe' to launch directly!
          2. No Java installation needed (Embedded JRE included in 'jre').
          3. Pre-configured with live cloud database.

          Default Seed Accounts:
          - Admin:   admin@clothify.com   / admin123
          - Cashier: cashier@clothify.com / cashier123
          ==================================================
          "@ | Out-File -FilePath dist\README.txt -Encoding utf8

          Compress-Archive -Path dist\* -DestinationPath Clothify-Store-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            clothify/clothify.exe
            clothify/Clothify-Store-Windows.zip
            clothify/target/clothify-*-jar-with-dependencies.jar
          draft: false
          prerelease: false
          generate_release_notes: true
